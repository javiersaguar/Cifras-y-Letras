<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cifras y Letras</title>
  <meta name="description" content="Resuelve la prueba de cifras y la de letras del concurso de La 2, directamente en el navegador.">
  <meta name="theme-color" content="#0b1530">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1530'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%23ffc53d'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="cabecera">
    <h1 class="logo"><span class="logo-cifras">Cifras</span> <span class="logo-y">y</span> <span class="logo-letras">Letras</span></h1>
    <nav class="pestanas" role="tablist">
      <button class="pestana" role="tab" data-tab="cifras" aria-selected="true">Cifras</button>
      <button class="pestana" role="tab" data-tab="letras" aria-selected="false">Letras</button>
    </nav>
  </header>

  <main>
    <!-- ===================== CIFRAS ===================== -->
    <section id="panel-cifras" class="panel" role="tabpanel">
      <div class="tablero">
        <div class="fila-objetivo">
          <input id="objetivo" class="marcador" type="text" inputmode="numeric" maxlength="4" placeholder="000" autocomplete="off" aria-label="Número objetivo">
          <button class="icono" id="btnObjetivoAleatorio" title="Objetivo aleatorio" aria-label="Objetivo aleatorio">🎲</button>
        </div>

        <div class="numeros" id="numeros"></div>
        <p class="pista">Toca dos veces una casilla para escribir otro número</p>

        <div class="teclado teclado-num" id="tecladoNum" aria-label="Teclado de números"></div>

        <div class="fila-ronda">
          <button class="btn secundario" id="btnRondaCifras">Ronda aleatoria</button>
          <div class="grandes" role="group" aria-label="Números grandes">
            <span class="etiqueta-sm">Grandes</span>
            <div class="chips" id="chipsGrandes">
              <button class="chip" data-grandes="0">0</button>
              <button class="chip" data-grandes="1">1</button>
              <button class="chip activo" data-grandes="2">2</button>
              <button class="chip" data-grandes="3">3</button>
              <button class="chip" data-grandes="4">4</button>
            </div>
          </div>
        </div>

        <div class="acciones">
          <button class="btn secundario" id="btnLimpiarCifras">Limpiar</button>
          <button class="btn secundario" id="btnJugarCifras">Jugar · 30 s</button>
          <button class="btn primario" id="btnResolverCifras">Resolver</button>
        </div>
        <div class="crono" id="cronoCifras" hidden><div class="crono-barra"></div><span class="crono-num"></span></div>
        <p class="aviso" id="avisoCifras" role="alert"></p>
      </div>

      <div class="resultado" id="resultadoCifras" hidden></div>
    </section>

    <!-- ===================== LETRAS ===================== -->
    <section id="panel-letras" class="panel" role="tabpanel" hidden>
      <div class="tablero">
        <div class="fichas" id="fichas" aria-live="polite"></div>
        <div class="contador" id="contadorLetras"></div>

        <div class="teclado teclado-letras" id="tecladoLetras" aria-label="Teclado de letras"></div>

        <div class="fila-ronda">
          <button class="btn secundario" id="btnVocal">+ Vocal</button>
          <button class="btn secundario" id="btnConsonante">+ Consonante</button>
          <button class="btn secundario" id="btnLetrasAleatorias">Aleatorias</button>
        </div>

        <label class="interruptor">
          <input type="checkbox" id="soloLemas">
          <span class="interruptor-pista"></span>
          <span>Solo formas de diccionario <small>(sin plurales ni verbos conjugados)</small></span>
        </label>

        <div class="acciones">
          <button class="btn secundario" id="btnBorrarLetras">Limpiar</button>
          <button class="btn secundario" id="btnJugarLetras">Jugar · 30 s</button>
          <button class="btn primario" id="btnResolverLetras">Buscar palabras</button>
        </div>
        <div class="crono" id="cronoLetras" hidden><div class="crono-barra"></div><span class="crono-num"></span></div>
        <p class="aviso" id="avisoLetras" role="alert"></p>
      </div>

      <div class="resultado" id="resultadoLetras" hidden></div>
    </section>

    <p class="atajos">Con teclado: escribe directamente · <kbd>Enter</kbd> resuelve · <kbd>Esc</kbd> limpia · <kbd>Tab</kbd> cambia de casilla</p>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <footer class="pie">
    Funciona sin conexión a ninguna API · Diccionario: <a href="https://github.com/words/an-array-of-spanish-words" target="_blank" rel="noopener">an-array-of-spanish-words</a> y <a href="https://github.com/wooorm/dictionaries" target="_blank" rel="noopener">dictionary-es</a> (LibreOffice) · <a href="https://github.com/javiersaguar/Cifras-y-Letras" target="_blank" rel="noopener">Código</a>
  </footer>

  <script src="js/cifras-solver.js"></script>
  <script src="js/letras-solver.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
